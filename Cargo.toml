[package]
name = "holy-url"
version = "0.1.0"
edition = "2021"
authors = ["404reese"]
description = "URL shortening service core logic"
license = "MIT"

[dependencies]
axum = { version = "0.7", default-features = false }
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
